[package]
name = "moonfield-render-feature"
version.workspace = true
edition.workspace = true

[features]
default = ["mesh"]
mesh = []
splat = ["mesh"]

[dependencies]
bytemuck = { version = "1.23", features = ["derive"] }
gltf = { workspace = true }
moonfield-app = { workspace = true }
moonfield-asset = { workspace = true }
moonfield-camera = { workspace = true }
moonfield-ecs = { workspace = true }
moonfield-log = { workspace = true }
moonfield-math = { workspace = true }
moonfield-reflect = { workspace = true }
moonfield-render-core = { workspace = true }
moonfield-rhi = { workspace = true }
moonfield-shader = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

# The synthetic splat reference asset's generator (M3 acceptance); needs the
# splat modules for the loader round-trip.
[[example]]
name = "gen_splat_asset"
required-features = ["splat"]

# The RHI backend is platform-selected: Vulkan everywhere but macOS, Metal 4
