[package]
name = "moonfield-rhi"
version.workspace = true
edition.workspace = true

[features]
# Exactly one backend feature is active in a build; the editor is the
# selection point. `default` only affects standalone builds of this crate —
# the workspace dependency carries `default-features = false`.
default = ["vulkan"]
vulkan = ["dep:moonfield-rhi-vulkan"]
metal = ["dep:moonfield-rhi-metal"]
# Development-build convenience: forwards to the Vulkan backend's validation
# layer (see moonfield-rhi-vulkan).
validation = ["vulkan", "moonfield-rhi-vulkan/validation"]

[dependencies]
moonfield-rhi-core = { path = "core" }
moonfield-rhi-vulkan = { path = "vulkan", optional = true }
moonfield-rhi-metal = { path = "metal", optional = true }
